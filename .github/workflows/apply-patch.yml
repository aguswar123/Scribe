name: Apply patch

on:
  workflow_dispatch:
    inputs:
      patch_file:
        description: Patch file name (in the repo root)
        required: true
        default: eta-estimates.patch
      commit_message:
        description: Commit message
        required: true
        default: Add ETA estimates while transcribing and ETA history in Settings

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch
        env:
          PATCH_FILE: ${{ inputs.patch_file }}
        run: |
          test -f "$PATCH_FILE" || { echo "Patch file not found: $PATCH_FILE"; exit 1; }
          git apply --check "$PATCH_FILE"
          git apply "$PATCH_FILE"
          rm -f "$PATCH_FILE"

      - name: Commit and push
        env:
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "$COMMIT_MESSAGE"
          git push
